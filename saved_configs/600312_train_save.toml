# Train and save the selected 600312.SH model artifact.
# Model artifacts are written only under stock_realtime/saved_models/.
# This command mirrors the selected 600312 model configuration after the directory cleanup.

title = "600312.SH train and save model"
cwd = "{project_dir}"

[[commands]]
id = "train_save_close_profit"
description = "Train selected close-profit model and save it as a reusable artifact."
args = [
  "{python}",
  "model_saving/save_nextday_model.py",
  "--stock-code", "600312.SH",
  "--artifact-name", "nextday_close_profit_xgb_d3_reversal_fundamental_regime_v1",
  "--samples", "saved_data/600312_pipeline_out/03_sector/training_samples_with_sector.csv",
  "--intraday-bars", "saved_data/600312_pipeline_out/00_base/600312_5m.csv",
  "--out-dir", "saved_models",
  "--feature-group", "reversal_fundamental_regime",
  "--model-name", "xgb_d3_400_lr003_mcw3",
  "--label-mode", "close_profit",
  "--entry-policy", "vwap_low",
  "--target-hit-bps", "50",
  "--round-trip-cost-bps", "1.7",
  "--valid-rows", "252",
  "--min-train-entries", "80",
  "--min-valid-trades", "8",
  "--quantiles", "0.5,0.6,0.7,0.8",
]

# ---------------------------------------------------------------------------
# Final official model pool + all_days candidates added after 2026-05-12 review
# ---------------------------------------------------------------------------

[stocks."600096.SH"]
sector_symbols = ["农化制品"]
# These fertilizer contexts are collected only if saved model feature_columns
# actually contains fert_* features.  Sector-only models will not trigger them.
context_groups = ["fert_stocks", "fert_etfs", "fert_futures", "fert_boards"]

[stocks."601985.SH"]
sector_symbols = ["电力"]
# Power/utility contexts are optional and feature-driven.
context_groups = ["pur_stocks", "pur_etfs", "pur_futures", "pur_boards"]

[stocks."603308.SH"]
sector_symbols = ["通用设备"]
# Required when using the strongest 应流 sector_external model with ane_* features.
context_groups = ["ane_stocks", "ane_etfs", "ane_futures", "ane_boards"]

# -------------------------
# 云天化 fertilizer profile
# -------------------------
[contexts.fert_stocks]
feature_prefixes = ["fert_stk_", "fert_stock_basket_", "fert_stock_vs_stock_basket_"]
provider = "sina_a_spot_or_daily"
symbols = ["600141.SH", "000422.SZ", "002895.SZ", "002539.SZ", "000830.SZ", "000893.SZ"]
canonical_prefix_template = "fert_stk_{code}"
aggregate_prefix = "fert_stock_basket"

[contexts.fert_etfs]
feature_prefixes = ["fert_etf_", "fert_etf_basket_", "fert_stock_vs_etf_basket_"]
provider = "sina_a_spot_or_daily"
symbols = ["159865.SZ", "516220.SH"]
canonical_prefix_template = "fert_etf_{code}"
aggregate_prefix = "fert_etf_basket"

[contexts.fert_futures]
feature_prefixes = ["fert_fut_", "fert_future_basket_", "fert_stock_vs_future_basket_"]
provider = "futures_main_sina_current"
symbols = ["UR0", "MA0", "SA0", "C0", "M0", "JM0", "ZC0"]
canonical_prefix_template = "fert_fut_{token}"
aggregate_prefix = "fert_future_basket"

[contexts.fert_boards]
feature_prefixes = ["fert_board_", "fert_board_basket_", "fert_stock_vs_board_basket_"]

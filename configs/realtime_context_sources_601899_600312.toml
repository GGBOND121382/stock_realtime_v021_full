# realtime_context_sources.toml
# 14:55 实盘信号实时上下文配置。
# 逻辑说明：
# 1) 代码不会因为这里配置了 context_groups 就无脑采集外部数据；
# 2) 实际是否采集 sector/external，由 saved_models/<stock>/<artifact>/feature_columns.txt 反推；
# 3) 如果模型没有用 gold_/copper_/zijin_hk_ 等特征，则不会采这些外部源；
# 4) 如果模型用了 sector_* / stock_vs_sector_*，则使用对应股票的 sector_symbols。

[defaults]
sector_provider = "ths_sector_spot"
external_context_mode = "estimated_asof_cutoff"


# ============================================================
# 601899.SH 紫金矿业
# ============================================================
# 推荐 sector_symbols：
# - 贵金属：贴近黄金属性；
# - 工业金属：贴近铜属性；
# - 小金属：作为有色/金属弹性补充。
#
# 注意：
# 如果你的最终实盘模型是 reversal_fundamental_regime_sector，
# 通常只会触发 sector 实时上下文，不会触发 gold/copper/silver/zijin_hk。
# 如果保存的是 all_no_ak 且 feature_columns 中包含 gold_* / copper_* / zijin_hk_*，
# 才会触发对应外部实时上下文采集与 as-of 特征估算。
[stocks."601899.SH"]
sector_symbols = ["贵金属", "工业金属", "小金属"]
context_groups = ["gold", "copper", "silver", "zijin_hk"]


# ============================================================
# 600312.SH 平高电气
# ============================================================
# 推荐 sector_symbols：
# - 电网设备：更贴近平高电气主业和你前面训练使用的行业口径。
#
# 平高电气当前没有配置外部 commodity/hk context。
# 如果模型只使用 reversal_fundamental_regime，则不会采 sector。
# 如果模型使用 reversal_fundamental_regime_sector，则会采电网设备板块实时上下文。
[stocks."600312.SH"]
sector_symbols = ["电网设备"]
context_groups = []


# ============================================================
# 通用外部上下文定义：紫金相关
# ============================================================

[contexts.gold]
# 匹配模型特征名前缀：
# gold_*、stock_vs_gold_*、gold_silver_ratio、gold_copper_ratio
feature_prefixes = ["gold_", "stock_vs_gold_", "gold_silver_ratio", "gold_copper_ratio"]
provider = "futures_main_sina_current"
# 国内期货主连：AU0。若你的 provider 实现使用外盘接口，可在代码/provider层映射到 GC/XAU。
symbols = ["AU0"]
canonical_prefix = "gold"

[contexts.copper]
# 匹配模型特征名前缀：
# copper_*、stock_vs_copper_*、gold_copper_ratio
feature_prefixes = ["copper_", "stock_vs_copper_", "gold_copper_ratio"]
provider = "futures_main_sina_current"
# 国内期货主连：CU0。若你的 provider 实现使用外盘接口，可在代码/provider层映射到 HG/CAD。
symbols = ["CU0"]
canonical_prefix = "copper"

[contexts.silver]
# 匹配模型特征名前缀：
# silver_*、gold_silver_ratio
feature_prefixes = ["silver_", "gold_silver_ratio"]
provider = "futures_main_sina_current"
symbols = ["AG0"]
canonical_prefix = "silver"

[contexts.zijin_hk]
# 匹配模型特征名前缀：
# zijin_hk_*、zijin_a_h_*
feature_prefixes = ["zijin_hk_", "zijin_a_h_"]
provider = "hk_spot_or_hist"
# 紫金矿业 H 股：02899
symbols = ["02899"]
canonical_prefix = "zijin_hk"

name: Apply AS1455 v7 live delta

on:
  push:
    branches:
      - agent/restore-as1455-live-strict-oos-v7-build

permissions:
  contents: write

jobs:
  apply-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v7 delta and publish final branch
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check .github/build/as1455_v7_only.patch
          git apply .github/build/as1455_v7_only.patch
          rm -f .github/build/as1455_v7_only.patch
          rm -f .github/workflows/apply-as1455-v7-final.yml
          rmdir .github/build 2>/dev/null || true
          git diff --check
          python3 -m py_compile code/backtest/run_as1455_close_auction_backtest_v7_maxpos_grid.py scripts/run_as1455_live_strict_oos_monitor.py
          grep -q 'initial_positions: object | None = None' code/backtest/run_as1455_close_auction_backtest_v7_maxpos_grid.py
          grep -q 'allow_single_date: bool = False' code/backtest/run_as1455_close_auction_backtest_v7_maxpos_grid.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: enable v7 single-day account-state execution'
          git push origin HEAD:refs/heads/agent/restore-as1455-live-strict-oos --force
